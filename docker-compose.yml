services:
  mongodb:
    image: mongo:8
    restart: unless-stopped
    ports:
      - "27018:27017"
    volumes:
      - jobatlas_mongodb:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 5s
      timeout: 4s
      retries: 12

volumes:
  jobatlas_mongodb:
